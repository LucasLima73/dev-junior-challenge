# Sobe o mock-service, a api (NestJS) e o web (React) juntos:
#   docker compose up
# O banco "db" fica disponível mas não é usado por padrão (persistência
# em memória, ver ENTREGA.md); mantido aqui caso queira plugar depois.

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      # Nome do serviço na rede do compose, não "localhost".
      CADASTRO_URL: http://mock-service:4000
    ports:
      - "3000:3000"
    depends_on:
      - mock-service

  web:
    build: ./web
    environment:
      # O navegador do usuário acessa a api pela porta publicada no host.
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
