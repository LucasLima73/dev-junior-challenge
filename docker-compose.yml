# Sobe o mock-service, o Postgres, a api (NestJS) e o web (React) juntos:
#   docker compose up

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d checkin"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      # Nome do serviço na rede do compose, não "localhost".
      CADASTRO_URL: http://mock-service:4000
      DATABASE_URL: postgres://desafio:desafio@db:5432/checkin
    ports:
      - "3000:3000"
    depends_on:
      mock-service:
        condition: service_started
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # O navegador do usuário acessa a api pela porta publicada no host.
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
