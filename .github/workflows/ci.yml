name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, build, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # "npm ci" é estrito demais com um peer dependency que o
      # vite-tsconfig-paths (usado só no vitest.config.ts) ainda não
      # suporta no TypeScript 6; "npm install" tolera isso, igual ao
      # ambiente local.
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  web:
    name: Web (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
